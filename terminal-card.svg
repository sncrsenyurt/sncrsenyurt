<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="sncrsenyurt@github neofetch">
  <defs>
    <style type="text/css"><![CDATA[
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .label { fill: #E4572E; font-size: 14px; font-weight: 600; }
      .value { fill: #E6EDF3; font-size: 14px; font-weight: 400; }
      .title { fill: #8B949E; font-size: 12px; font-weight: 500; }
      .user { fill: #E6EDF3; font-size: 15px; font-weight: 600; }
      .sep { fill: #30363d; font-size: 14px; }
      .prompt { fill: #E4572E; font-size: 13px; }
      .cmd { fill: #E6EDF3; font-size: 13px; }
      .swatch { stroke: #30363d; stroke-width: 1; }
    ]]></style>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="339" rx="10" ry="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <rect x="0.5" y="0.5" width="899" height="36" rx="10" ry="10" fill="#161b22"/>
  <rect x="0.5" y="18" width="899" height="18.5" fill="#161b22"/>
  <line x1="0.5" y1="36.5" x2="899.5" y2="36.5" stroke="#30363d" stroke-width="1"/>

  <circle cx="22" cy="18.5" r="5.5" fill="#3d1f1f" stroke="#8B3A3A" stroke-width="1"/>
  <circle cx="40" cy="18.5" r="5.5" fill="#3d3420" stroke="#8B7A3A" stroke-width="1"/>
  <circle cx="58" cy="18.5" r="5.5" fill="#1f3d2a" stroke="#3A8B5A" stroke-width="1"/>

  <text x="450" y="23" text-anchor="middle" class="mono title">neofetch · sncrsenyurt</text>

  <!-- Left: geometric block art -->
  <g transform="translate(48, 62)" fill="#E4572E">
    <rect x="0" y="0" width="168" height="188" rx="4" fill="none" stroke="#E4572E" stroke-width="2" opacity="0.9"/>
    <rect x="18" y="18" width="22" height="22" rx="2"/>
    <rect x="48" y="18" width="22" height="22" rx="2" opacity="0.55"/>
    <rect x="78" y="18" width="22" height="22" rx="2"/>
    <rect x="108" y="18" width="22" height="22" rx="2" opacity="0.35"/>
    <rect x="18" y="48" width="22" height="22" rx="2" opacity="0.55"/>
    <rect x="48" y="48" width="52" height="22" rx="2"/>
    <rect x="108" y="48" width="22" height="22" rx="2" opacity="0.7"/>
    <rect x="18" y="78" width="22" height="22" rx="2"/>
    <rect x="48" y="78" width="22" height="22" rx="2" opacity="0.35"/>
    <rect x="78" y="78" width="52" height="22" rx="2"/>
    <rect x="18" y="108" width="52" height="22" rx="2" opacity="0.7"/>
    <rect x="78" y="108" width="22" height="22" rx="2"/>
    <rect x="108" y="108" width="22" height="22" rx="2" opacity="0.55"/>
    <rect x="18" y="138" width="22" height="22" rx="2" opacity="0.4"/>
    <rect x="48" y="138" width="22" height="22" rx="2"/>
    <rect x="78" y="138" width="22" height="22" rx="2" opacity="0.55"/>
    <rect x="108" y="138" width="22" height="22" rx="2"/>
    <rect x="18" y="168" width="14" height="14" rx="1">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="40" y="172" width="90" height="6" rx="1" opacity="0.25"/>
  </g>

  <line x1="248" y1="56" x2="248" y2="268" stroke="#30363d" stroke-width="1"/>

  <!-- Right: classic neofetch / OS-style fields -->
  <g class="mono" transform="translate(280, 68)">
    <text x="0" y="0" class="user">sncrsenyurt</text>
    <text x="118" y="0" class="label">@</text>
    <text x="132" y="0" class="user">github</text>
    <text x="0" y="18" class="sep">--------------------------------</text>

    <text x="0" y="44" class="label">OS</text>
    <text x="100" y="44" class="value" fill="#8B949E">:</text>
    <text x="118" y="44" class="value">Tesla · Vehicle Software</text>

    <text x="0" y="70" class="label">Host</text>
    <text x="100" y="70" class="value" fill="#8B949E">:</text>
    <text x="118" y="70" class="value">Software QA Engineer</text>

    <text x="0" y="96" class="label">Kernel</text>
    <text x="100" y="96" class="value" fill="#8B949E">:</text>
    <text x="118" y="96" class="value">In-vehicle UI / Robotaxi</text>

    <text x="0" y="122" class="label">Shell</text>
    <text x="100" y="122" class="value" fill="#8B949E">:</text>
    <text x="118" y="122" class="value">bash · Jenkins · Docker</text>

    <text x="0" y="148" class="label">Packages</text>
    <text x="100" y="148" class="value" fill="#8B949E">:</text>
    <text x="118" y="148" class="value">Python · Ruby · JS · Svelte</text>

    <text x="0" y="174" class="label">Uptime</text>
    <text x="100" y="174" class="value" fill="#8B949E">:</text>
    <text x="118" y="174" class="value">Zoox · Autoliv → Tesla</text>

    <text x="0" y="200" class="label">Locale</text>
    <text x="100" y="200" class="value" fill="#8B949E">:</text>
    <text x="118" y="200" class="value">San Francisco, CA</text>

    <!-- color swatches like real neofetch -->
    <g transform="translate(0, 222)">
      <rect class="swatch" x="0" y="0" width="18" height="18" fill="#0d1117"/>
      <rect class="swatch" x="22" y="0" width="18" height="18" fill="#161b22"/>
      <rect class="swatch" x="44" y="0" width="18" height="18" fill="#30363d"/>
      <rect class="swatch" x="66" y="0" width="18" height="18" fill="#8B949E"/>
      <rect class="swatch" x="88" y="0" width="18" height="18" fill="#E6EDF3"/>
      <rect class="swatch" x="110" y="0" width="18" height="18" fill="#E4572E"/>
    </g>
  </g>

  <g class="mono" transform="translate(48, 312)">
    <text x="0" y="0" class="prompt">$</text>
    <text x="16" y="0" class="cmd">still typing...</text>
    <rect x="148" y="-11" width="8" height="14" fill="#E4572E">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
